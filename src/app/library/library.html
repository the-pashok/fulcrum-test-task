<app-library-header
  [books]="books()"
  (openAddBookModal)="isBookModalVisible.set(true)"
  (loadBooksFromXML)="loadBooksFromXML($event)"
></app-library-header>

@if (errorText()) {
  <app-library-upload-error
    [errorText]="errorText()"
    (dismissError)="dismissError()"
  ></app-library-upload-error>
}

@if (books().length > 0) {
  <app-library-search
    [(search)]="search"
  ></app-library-search>
  @if (filteredBooks().length > 0) {
    <app-library-table
      [books]="sortedBooks()"
      [sort]="sort()"
      (sortChange)="changeSort($event)"
      (editBook)="startEditBook($event)"
      (deleteBook)="deleteBook($event)"
    ></app-library-table>
  } @else {
    <app-library-search-empty
      [search]="search()"
    ></app-library-search-empty>
  }
} @else {
  <app-library-empty></app-library-empty>
}

@if (isBookModalVisible()) {
  <app-book-modal
    [book]="selectedBook()"
    (closed)="closeBookModal()"
    (saveBook)="saveBook($event)"
  ></app-book-modal>
}
