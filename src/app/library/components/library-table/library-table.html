<section class="library-table">
  <div class="container">
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
          <th scope="col" (click)="sortChange.emit('title')">
            <div class="d-flex justify-content-between">
              <span>Title</span>
              <span>{{ sortIcon('title') }}</span>
            </div>
          </th>
          <th scope="col" (click)="sortChange.emit('author')">
            <div class="d-flex justify-content-between">
              <span>Author</span>
              <span>{{ sortIcon('author') }}</span>
            </div>
          </th>
          <th scope="col" (click)="sortChange.emit('pages')">
            <div class="d-flex justify-content-between">
              <span>Pages</span>
              <span>{{ sortIcon('pages') }}</span>
            </div>
          </th>
          <th></th>
          <th></th>
        </tr>
        </thead>
        <tbody>
          @for (book of books(); track book.uuid) {
            <tr>
              <td>{{ book.title }}</td>
              <td>{{ book.author }}</td>
              <td>{{ book.pages }}</td>
              <td>
                <button type="button" class="btn btn-primary btn-link" (click)="editBook.emit(book.uuid)">
                  Edit
                </button>
              </td>
              <td>
                <button type="button" class="btn btn-danger btn-link" (click)="deleteBook.emit(book.uuid)">
                  Delete
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
